<!DOCTYPE html>
<!-- Ícone do app (512x423, formato usado pelas TVs Samsung). Gerado por tools/wallpapers.mjs icon -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 423px; overflow: hidden; background: #0b0d12; }
  .bg { position: absolute; inset: 0; background: url("../../app/wallpapers/alvorada.jpg") 62% 70% / 260% auto; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,30,.15), rgba(10,12,30,.45)); }
  .pane {
    position: absolute; left: 76px; right: 76px; top: 118px; height: 188px;
    border-radius: 48px;
    background: rgba(255,255,255,.16);
    border: 2px solid rgba(255,255,255,.35);
    box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4);
    backdrop-filter: blur(22px) saturate(160%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff;
  }
  .name { font-size: 58px; font-weight: 600; letter-spacing: -1px; }
  .dots { display: flex; gap: 14px; }
  .dots span { width: 40px; height: 24px; border-radius: 8px; background: rgba(255,255,255,.55); }
  .dots span:first-child { background: #fff; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="pane">
    <div class="name">Glass TV</div>
    <div class="dots"><span></span><span></span><span></span><span></span></div>
  </div>
</body>
</html>
